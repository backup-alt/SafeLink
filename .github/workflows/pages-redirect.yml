name: Publish SafeLink link

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages-redirect.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Generate redirect page
        env:
          SAFELINK_RAILWAY_URL: ${{ vars.SAFELINK_RAILWAY_URL || 'https://safelink-production-459e.up.railway.app/' }}
        run: |
          python3 - <<'PY'
          import html
          import json
          import os
          import pathlib
          import re
          from urllib.parse import urlsplit

          raw = os.environ['SAFELINK_RAILWAY_URL'].strip()
          parsed = urlsplit(raw)
          if (
              parsed.scheme != 'https'
              or not parsed.hostname
              or not re.fullmatch(r'[A-Za-z0-9.-]+', parsed.hostname)
              or parsed.username
              or parsed.password
              or parsed.path not in ('', '/')
              or parsed.query
              or parsed.fragment
          ):
              raise SystemExit('SAFELINK_RAILWAY_URL must be an HTTPS site origin')

          target = raw.rstrip('/') + '/'
          js_target = json.dumps(target).replace('<', r'\u003c').replace('>', r'\u003e').replace('&', r'\u0026')
          safe_target = html.escape(target, quote=True)
          page = f'''<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="robots" content="noindex">
            <title>Opening SafeLink</title>
            <noscript><meta http-equiv="refresh" content="0; url={safe_target}"></noscript>
          </head>
          <body>
            <p>Opening SafeLink… <a href="{safe_target}">Continue to SafeLink</a>.</p>
            <script>location.replace({js_target} + location.search + location.hash)</script>
          </body>
          </html>
          '''
          output = pathlib.Path('_site')
          output.mkdir(exist_ok=True)
          (output / 'index.html').write_text(page, encoding='utf-8')
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload redirect page
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
